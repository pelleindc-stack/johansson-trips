<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Spain family trip planning route</title>
  <desc id="desc">Schematic route showing the Nerja base, Burriana Beach, Caminito del Rey, Ronda and Málaga Airport.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="1" stop-color="#eef5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#173d38" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#bg)"/>
  <path d="M120 362 C245 270 270 150 418 136 S638 177 760 90" fill="none" stroke="#9dbfae" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18"/>
  <path d="M120 362 C230 420 372 424 518 338 S704 270 820 300" fill="none" stroke="#254f45" stroke-width="7" stroke-linecap="round"/>
  <path d="M120 362 C245 270 270 150 418 136" fill="none" stroke="#d39d4c" stroke-width="7" stroke-linecap="round"/>
  <path d="M418 136 C550 130 662 178 760 90" fill="none" stroke="#a95035" stroke-width="7" stroke-linecap="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#173d38">
    <text x="44" y="58" font-size="20" font-weight="800" letter-spacing="3">SPAIN 2026 · PLANNING MAP</text>
    <text x="44" y="88" font-size="16" fill="#59706c">Nerja base · local days · two major excursions</text>
    <text x="44" y="485" font-size="14" fill="#59706c">Schematic planning view — not to scale. Use the Apple Maps buttons for driving directions.</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="120" cy="362" r="24" fill="#254f45" stroke="#fffefa" stroke-width="7"/>
    <circle cx="250" cy="296" r="20" fill="#d39d4c" stroke="#fffefa" stroke-width="7"/>
    <circle cx="418" cy="136" r="24" fill="#a95035" stroke="#fffefa" stroke-width="7"/>
    <circle cx="594" cy="313" r="24" fill="#254f45" stroke="#fffefa" stroke-width="7"/>
    <circle cx="760" cy="90" r="22" fill="#6d7d86" stroke="#fffefa" stroke-width="7"/>
    <circle cx="820" cy="300" r="20" fill="#6d7d86" stroke="#fffefa" stroke-width="7"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#173d38">
    <text x="72" y="407" font-size="20" font-weight="800">Nerja base</text>
    <text x="72" y="430" font-size="15" fill="#59706c">Royal Palm 22</text>
    <text x="215" y="258" font-size="18" font-weight="800">Burriana Beach</text>
    <text x="215" y="279" font-size="14" fill="#59706c">Cabanas · Nybakat</text>
    <text x="384" y="90" font-size="18" font-weight="800">Caminito del Rey</text>
    <text x="384" y="113" font-size="14" fill="#59706c">Tuesday must-see</text>
    <text x="563" y="362" font-size="20" font-weight="800">Ronda</text>
    <text x="563" y="383" font-size="14" fill="#59706c">Monday must-see</text>
    <text x="700" y="58" font-size="18" font-weight="800">Málaga Airport</text>
    <text x="700" y="79" font-size="14" fill="#59706c">Arrival / rental car</text>
    <text x="733" y="346" font-size="18" font-weight="800">Optional</text>
    <text x="733" y="367" font-size="14" fill="#59706c">Cueva / Granada</text>
  </g>
</svg>
